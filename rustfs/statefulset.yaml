apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
  namespace: object-storage
spec:
  serviceName: rustfs
  # Single node single disk mode
  # for ease of resource management
  replicas: 1

  selector:
    matchLabels:
      app: rustfs

  template:
    metadata:
      labels:
        app: rustfs

    spec:
      securityContext:
        # Helps ensure access
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch

      containers:
        - name: rustfs
          image: rustfs/rustfs:latest

          args:
            # This is the directory used
            # by RustFS to keep the data
            - /data

          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001

          env:
            - name: RUSTFS_ADDRESS
              value: "0.0.0.0:9000"

            - name: RUSTFS_CONSOLE_ADDRESS
              value: "0.0.0.0:9001"

            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"

            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: access-key

            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: secret-key

          volumeMounts:
            - name: rustfs-data
              mountPath: /data

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi

          readinessProbe:
            # Pod is ready once this endpoint responds
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            # Same endpoint serves for healthcheck as well
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20

      volumes:
        - name: rustfs-data
          persistentVolumeClaim:
            claimName: rustfs-data
