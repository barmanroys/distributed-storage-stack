apiVersion: v1
kind: Secret
metadata:
  name: juicefs-secret
  namespace: object-storage
type: Opaque
# These secrets are later used by the format job
stringData:
  # JuiceFS filesystem name
  name: risk-model-storage

  # PostgreSQL connection string, get the username, password, service and database name
  # from the database.yaml
  metaurl: "postgres://juicefs:juicefs-postgres-password@postgres.object-storage.svc.cluster.local:5432/juicefs"

  # RustFS S3-compatible object storage
  storage: s3
  # The last part is the bucket name created from the RustFS web console
  bucket: "http://rustfs.object-storage.svc.cluster.local:9000/juice-fs-bucket"

  # RustFS credentials
  access-key: "portfolio-admin"
  secret-key: "change-this-to-a-long-random-secret"
